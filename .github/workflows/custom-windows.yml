name: Custom server build.

# Builds the patched Telegram Desktop (hardcoded MTProto server) as a Release
# Windows x64 binary and uploads Telegram.exe as a downloadable artifact.
#
# Run it from the Actions tab ("Run workflow") or push to the custom-server
# branch. No local Visual Studio installation is required.

on:
  workflow_dispatch:
  push:
    branches:
      - custom-server

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows x64 Release
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      REPO_DIR: tdesktop

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$REPO_DIR/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $REPO_DIR/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-

      # No 'skip-release' here: the app is built in Release, so it needs the
      # Release flavour of openssl/tg_angle/ffmpeg/libavif/etc. Without it the
      # link step dies with LNK1181 (missing .lib) and LNK2038 (MT vs MTd).
      # Cost: both flavours are built, roughly 2.5h on a cold cache.
      - name: Libraries.
        run: |
          %REPO_DIR%\Telegram\build\prepare\win.bat silent

      # Save the libraries immediately: a later build failure would otherwise
      # throw away hours of work, because cache post-steps are skipped when
      # the job fails.
      - name: Save Libraries cache.
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}

      - name: Save ThirdParty cache.
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Configure.
        run: |
          cd %REPO_DIR%\Telegram
          call configure.bat x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build.
        run: |
          cmake --build %REPO_DIR%\out --config Release --parallel

      - name: Verify build output.
        shell: bash
        run: |
          ls -la "$REPO_DIR/out/Release" | head -40
          test -f "$REPO_DIR/out/Release/Telegram.exe"
          ls -lh "$REPO_DIR/out/Release/Telegram.exe"

      - name: Move artifact.
        run: |
          mkdir artifact
          move %REPO_DIR%\out\Release\Telegram.exe artifact\

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: PlumeGram-Desktop-win64
          path: artifact\
          retention-days: 30
