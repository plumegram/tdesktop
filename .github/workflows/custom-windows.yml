name: Custom server build.

# Builds the patched Telegram Desktop (hardcoded MTProto server) as a Release
# Windows x64 binary and uploads Telegram.exe as a downloadable artifact.
#
# Run it from the Actions tab ("Run workflow") or push to the custom-server
# branch. No local Visual Studio installation is required.

on:
  workflow_dispatch:
  push:
    branches:
      - custom-server

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows x64 Release
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      REPO_DIR: tdesktop

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$REPO_DIR/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $REPO_DIR/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      # Unique key per run + prefix restore: every attempt saves whatever it
      # managed to build, and the next run resumes from the newest tree.
      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ runner.arch }}-libs-rel-

      # No 'skip-release' here: the app is built in Release, so it needs the
      # Release flavour of openssl/tg_angle/ffmpeg/libavif/etc. Without it the
      # link step dies with LNK1181 (missing .lib) and LNK2038 (MT vs MTd).
      # Cost: both flavours are built, roughly 2.5h on a cold cache.
      #
      # The runner's Visual Studio is "18\Enterprise" and its ATL lives in
      # VC\Tools\MSVC\<ver>\atlmfc, while breakpad's generated dump_syms.vcxproj
      # hardcodes /I"$(VCInstallDir)VC\atlmfc\include" -- a path that does not
      # exist there. That used to kill the whole prepare with
      #   error C1083: Cannot open include file: 'atlbase.h'
      # so the dump_syms tool is not built at all (see the patch to
      # Telegram/build/prepare/prepare.py). It is only needed to produce .sym
      # files for crash reports, and those are disabled for this build.
      - name: Libraries.
        run: |
          %REPO_DIR%\Telegram\build\prepare\win.bat silent

      # Save the libraries immediately: a later build failure would otherwise
      # throw away hours of work, because cache post-steps are skipped when
      # the job fails. 'always()' also keeps a half-finished tree, and
      # prepare.py resumes from it (its own cache_keys mark finished stages).
      #
      # Careful: only the Qt *build* tree (Libraries/win64/qt_6.x, lowercase) is
      # expendable. The install prefix (Libraries/win64/Qt-6.x) must stay
      # byte-for-byte complete -- Qt6*Targets.cmake references every installed
      # *.obj by path and configure dies if one is gone:
      #   The imported target "Qt6::Gui_resources_1" references the file
      #   ".../objects-Debug/Gui_resources_1/.qt/rcc/qrc_qpdf_init.cpp.obj"
      #   but this file does not exist.
      # .pdb/.ilk are never referenced by those cmake files, so they are safe.
      - name: Free up some disk space.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          rm -rf Libraries/win64/qt_* 2>/dev/null || true
          find Libraries -type f \( -name '*.pdb' -o -name '*.ilk' \) -delete 2>/dev/null || true

      - name: Save Libraries cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save ThirdParty cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      # Cheap, and it answers the only question that matters when the build
      # dies with C1060/C3859/LNK1102: how much commit room was there.
      - name: Report memory and free space.
        shell: pwsh
        run: |
          Get-PSDrive C, D | ForEach-Object {
            '{0}: {1} GB free' -f $_.Name, [math]::Round($_.Free / 1GB, 1)
          }
          Get-CimInstance Win32_PageFileUsage |
            ForEach-Object { 'pagefile {0}: {1} MB allocated, {2} MB in use' -f $_.Name, $_.AllocatedBaseSize, $_.CurrentUsage }
          $os = Get-CimInstance Win32_OperatingSystem
          'physical: {0} MB total, {1} MB free' -f [math]::Round($os.TotalVisibleMemorySize / 1KB), [math]::Round($os.FreePhysicalMemory / 1KB)
          'commit limit: {0} MB (of which {1} MB is paging files)' -f [math]::Round($os.TotalVirtualMemorySize / 1KB), [math]::Round($os.SizeStoredInPagingFiles / 1KB)

      - name: Configure.
        run: |
          cd %REPO_DIR%\Telegram
          call configure.bat x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          rem Debug info is off on purpose: cl gets no /Zi and link gets no
          rem /DEBUG, so no multi-gigabyte Telegram.pdb is generated. Crash
          rem reports are disabled anyway, and building that PDB is what pushed
          rem link.exe past the runner's commit limit (LNK1102).
          findstr /C:"GenerateDebugInformation" %REPO_DIR%\out\Telegram\Telegram.vcxproj || echo GenerateDebugInformation is not set at all.

      # The runner's paging file is small and fixed, so the whole job has a hard
      # commit limit. When it is reached the compiler reports:
      #
      #   error C3859: Failed to create virtual memory for PCH
      #   the system returned code 1455: The paging file is too small ...
      #   error C1060: compiler is out of heap space
      #
      # and the linker reports LNK1102. Two nodes is what fits: the Telegram
      # project compiles ~1900 sources against a very large PCH and each cl.exe
      # keeps a copy of it mapped, so four nodes (the default, one per core) blow
      # the limit about 90% into the build. The work is mostly serial inside the
      # single Telegram.vcxproj anyway, so the extra nodes only cover its
      # dependencies and cost little.
      #
      # Temp files go to D: as well: C: holds the paging file, and anything
      # written there makes it harder for Windows to grow it.
      - name: Build.
        env:
          TMP: D:\tmp
          TEMP: D:\tmp
        run: |
          if not exist D:\tmp mkdir D:\tmp
          cmake --build %REPO_DIR%\out --config Release --parallel 2
          if errorlevel 1 (
            echo.
            echo First attempt failed. Retrying with a single node: objects that
            echo were already built are reused, so only the files that died are
            echo compiled again.
            cmake --build %REPO_DIR%\out --config Release --parallel 1
            if errorlevel 1 exit /b 1
          )

      - name: Verify build output.
        shell: bash
        run: |
          ls -la "$REPO_DIR/out/Release" | head -40
          test -f "$REPO_DIR/out/Release/Telegram.exe"
          ls -lh "$REPO_DIR/out/Release/Telegram.exe"

      - name: Move artifact.
        run: |
          mkdir artifact
          move %REPO_DIR%\out\Release\Telegram.exe artifact\

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: PlumeGram-Desktop-win64
          path: artifact\
          retention-days: 30
