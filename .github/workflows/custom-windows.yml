name: Custom server build.

# Builds the patched Telegram Desktop (hardcoded MTProto server) as a Release
# Windows x64 binary and uploads Telegram.exe as a downloadable artifact.
#
# Run it from the Actions tab ("Run workflow") or push to the custom-server
# branch. No local Visual Studio installation is required.

on:
  workflow_dispatch:
  push:
    branches:
      - custom-server

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows x64 Release
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      REPO_DIR: tdesktop

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$REPO_DIR/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $REPO_DIR/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # breakpad's dump_syms tool includes <atlbase.h> / <atlcomcli.h>, but the
      # windows-latest image does not ship the ATL component for VS 18.
      # Without it prepare dies with:
      #   error C1083: Cannot open include file: 'atlbase.h'
      - name: Install ATL component.
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          set "VSPATH="
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo ERROR: no Visual Studio instance with C++ tools found.
            exit /b 1
          )
          echo VS instance: %VSPATH%

          if exist "%VSPATH%\VC\atlmfc\include\atlbase.h" goto atl_found

          echo Installing the ATL component...
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vs_installer.exe" modify ^
            --installPath "%VSPATH%" ^
            --add Microsoft.VisualStudio.Component.VC.ATL ^
            --quiet --norestart --nocache
          echo vs_installer exit code: %errorlevel%

          set /a atl_tries=0
          :atl_loop
          if exist "%VSPATH%\VC\atlmfc\include\atlbase.h" goto atl_found
          for /d %%d in ("%VSPATH%\VC\Tools\MSVC\*") do (
            if exist "%%d\atlmfc\include\atlbase.h" goto atl_found_tools
          )
          set /a atl_tries+=1
          if %atl_tries% GEQ 40 goto atl_fail
          rem 'timeout' is unusable here: stdin is redirected in CI.
          ping -n 11 127.0.0.1 >nul
          goto atl_loop

          :atl_fail
          echo ERROR: atlbase.h is still missing after installing the ATL component.
          echo Installed VC components:
          dir /b "%VSPATH%\VC"
          exit /b 1

          :atl_found_tools
          for /d %%d in ("%VSPATH%\VC\Tools\MSVC\*") do (
            if exist "%%d\atlmfc\include\atlbase.h" echo ATL_INCLUDE=%%d\atlmfc\include>>%GITHUB_ENV%
          )
          echo ATL headers found under VC\Tools\MSVC.

          :atl_found
          if exist "%VSPATH%\VC\atlmfc\include\atlbase.h" echo ATL_INCLUDE=%VSPATH%\VC\atlmfc\include>>%GITHUB_ENV%
          echo ATL headers are in place.

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      # Unique key per run + prefix restore: every attempt saves whatever it
      # managed to build, and the next run resumes from the newest tree.
      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ runner.arch }}-libs-rel-

      # No 'skip-release' here: the app is built in Release, so it needs the
      # Release flavour of openssl/tg_angle/ffmpeg/libavif/etc. Without it the
      # link step dies with LNK1181 (missing .lib) and LNK2038 (MT vs MTd).
      # Cost: both flavours are built, roughly 2.5h on a cold cache.
      - name: Libraries.
        run: |
          rem breakpad's dump_syms looks for atlbase.h through the project's
          rem -I paths; expose the installed ATL folder through INCLUDE too.
          if defined ATL_INCLUDE set "INCLUDE=%ATL_INCLUDE%;%INCLUDE%"
          %REPO_DIR%\Telegram\build\prepare\win.bat silent

      # Save the libraries immediately: a later build failure would otherwise
      # throw away hours of work, because cache post-steps are skipped when
      # the job fails. 'always()' also keeps a half-finished tree, and
      # prepare.py resumes from it (its own cache_keys mark finished stages).
      - name: Free up some disk space.
        shell: bash
        run: |
          find Libraries '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save Libraries cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save ThirdParty cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Configure.
        run: |
          cd %REPO_DIR%\Telegram
          call configure.bat x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build.
        run: |
          cmake --build %REPO_DIR%\out --config Release --parallel

      - name: Verify build output.
        shell: bash
        run: |
          ls -la "$REPO_DIR/out/Release" | head -40
          test -f "$REPO_DIR/out/Release/Telegram.exe"
          ls -lh "$REPO_DIR/out/Release/Telegram.exe"

      - name: Move artifact.
        run: |
          mkdir artifact
          move %REPO_DIR%\out\Release\Telegram.exe artifact\

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: PlumeGram-Desktop-win64
          path: artifact\
          retention-days: 30
